name: Release packages

# Execução somente manual (Actions > Run workflow). A versão vem de version.iss.
on:
  workflow_dispatch:

# Build jobs run third-party actions/installers: read-only token.
permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache pinned yt-dlp bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/third_party/yt-dlp
          key: ytdlp-${{ runner.os }}-${{ hashFiles('cmake/YtDlpBundle.cmake') }}
      - run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build g++ qt6-base-dev qt6-base-dev-tools ffmpeg dpkg-dev
      - name: Configure release build
        shell: bash
        run: |
          version=$(sed -n 's/^#define PRISM_VERSION "\([0-9.]*\)"$/\1/p' version.iss)
          test -n "$version"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - run: cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - name: Package and smoke test DEB
        shell: bash
        run: |
          cpack --config build/CPackConfig.cmake -G DEB -B package
          package_file=$(find package -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package_file"
          dpkg-deb --contents "$package_file" | grep -q 'usr/bin/prism-downloader'
          dpkg-deb --contents "$package_file" | grep -q 'usr/lib/prism-downloader/yt-dlp'
          dpkg-deb --field "$package_file" Depends | grep -q 'ffmpeg'
          sudo apt-get install --yes "$package_file"
          status=0; timeout 5s env QT_QPA_PLATFORM=offscreen prism-downloader || status=$?; test "$status" -eq 124
          mkdir -p release-assets
          version=$(sed -n 's/^#define PRISM_VERSION "\([0-9.]*\)"$/\1/p' version.iss)
          cp "$package_file" "release-assets/prism-downloader_${version}_amd64.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: release-assets/*.deb
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache pinned yt-dlp bundle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/third_party/yt-dlp
          key: ytdlp-${{ runner.os }}-${{ hashFiles('cmake/YtDlpBundle.cmake') }}
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.7.2
          arch: win64_msvc2019_64
      - shell: pwsh
        run: choco install innosetup ffmpeg --yes --no-progress
      - name: Configure release build
        shell: pwsh
        run: |
          $version = (Select-String -Path version.iss -Pattern '^#define PRISM_VERSION "([0-9.]+)"$').Matches[0].Groups[1].Value
          if (-not $version) { throw 'PRISM_VERSION not found in version.iss.' }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
          if (-not (Test-Path "build/Release/yt-dlp.exe")) { throw 'yt-dlp.exe was not copied.' }
      - name: Package Setup and Portable
        shell: pwsh
        run: |
          $version = (Select-String -Path version.iss -Pattern '^#define PRISM_VERSION "([0-9.]+)"$').Matches[0].Groups[1].Value
          Copy-Item -LiteralPath (Get-Command ffmpeg.exe).Source -Destination build/Release/ffmpeg.exe -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup_script.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          New-Item -ItemType Directory -Path release-assets,portable-staging -Force | Out-Null
          Copy-Item -Path build/Release/* -Destination portable-staging -Recurse -Force
          @('PrismDownloaderTests.exe','PrismMediaMetadataTests.exe','PrismFormatSelectionDialogTests.exe','PrismMediaToolResolverTests.exe','PrismYtDlpUpdateServiceTests.exe','PrismAppUpdateServiceTests.exe','PrismPortableUpdateCommonTests.exe','PrismFakeMediaTool.exe','PrismQueueManagerTests.exe') | ForEach-Object { Remove-Item -LiteralPath (Join-Path portable-staging $_) -Force -ErrorAction SilentlyContinue }
          Remove-Item -LiteralPath (Join-Path portable-staging 'platforms/qoffscreen.dll') -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path portable-staging/* -DestinationPath "release-assets/PrismDownloader_v$($version)_Portable.zip" -Force
          Copy-Item -LiteralPath "dist/PrismDownloader_v$($version)_Setup.exe" -Destination release-assets
          if (-not (Test-Path "release-assets/PrismDownloader_v$($version)_Setup.exe") -or -not (Test-Path "release-assets/PrismDownloader_v$($version)_Portable.zip")) { throw 'Windows release assets are incomplete.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: [build-deb, build-windows]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release manifest
        shell: bash
        run: |
          version=$(sed -n 's/^#define PRISM_VERSION "\([0-9.]*\)"$/\1/p' version.iss)
          test -n "$version"
          python3 scripts/create_update_manifest.py --version "$version" --output release-assets/prism-update-manifest.json \
            --asset "PrismDownloader_v${version}_Setup.exe=release-assets/PrismDownloader_v${version}_Setup.exe" \
            --asset "PrismDownloader_v${version}_Portable.zip=release-assets/PrismDownloader_v${version}_Portable.zip" \
            --asset "prism-downloader_${version}_amd64.deb=release-assets/prism-downloader_${version}_amd64.deb"
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^#define PRISM_VERSION "\([0-9.]*\)"$/\1/p' version.iss)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "Prism Downloader $tag" --generate-notes
          fi

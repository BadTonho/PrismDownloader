name: Release

# Gera e publica uma release no GitHub com todos os pacotes (Windows instalador
# e portátil, Linux DEB/RPM e Linux portátil AppImage/tar.gz) + manifesto SHA-256.
# Pode ser disparado manualmente em Actions > Release > Run workflow ou por tag v*.
# A tag precisa ser igual a v<PRISM_VERSION> definido em version.iss.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v2.0.3). Vazio usa v<PRISM_VERSION> de version.iss"
        required: false
        default: ""
        type: string
      draft:
        description: "Publicar como rascunho (draft)"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Marcar como pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

# Jobs de build executam actions/instaladores de terceiros: token somente leitura.
permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate version and release tag
        id: check
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^#define PRISM_VERSION "\([0-9.]*\)"$/\1/p' version.iss)
          test -n "$version" || { echo "PRISM_VERSION not found in version.iss"; exit 1; }
          expected_tag="v${version}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${expected_tag}"
          fi
          test "${tag}" = "${expected_tag}" || {
            echo "Release tag '${tag}' != '${expected_tag}' (version.iss)"
            exit 1
          }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  publish-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: [verify-version, build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          version="${RELEASE_VERSION}"
          python3 scripts/create_update_manifest.py --version "$version" --output release-assets/prism-update-manifest.json \
            --asset "PrismDownloader_v${version}_Setup.exe=release-assets/PrismDownloader_v${version}_Setup.exe" \
            --asset "PrismDownloader_v${version}_Portable.zip=release-assets/PrismDownloader_v${version}_Portable.zip" \
            --asset "prism-downloader_${version}_amd64.deb=release-assets/prism-downloader_${version}_amd64.deb" \
            --asset "prism-downloader_${version}_ubuntu22.04_amd64.deb=release-assets/prism-downloader_${version}_ubuntu22.04_amd64.deb" \
            --asset "prism-downloader_${version}_debian12_amd64.deb=release-assets/prism-downloader_${version}_debian12_amd64.deb" \
            --asset "prism-downloader_${version}_x86_64.rpm=release-assets/prism-downloader_${version}_x86_64.rpm" \
            --asset "PrismDownloader_v${version}_x86_64.AppImage=release-assets/PrismDownloader_v${version}_x86_64.AppImage" \
            --asset "PrismDownloader_v${version}_linux_x86_64.tar.gz=release-assets/PrismDownloader_v${version}_linux_x86_64.tar.gz"
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
          RELEASE_TAG: ${{ needs.verify-version.outputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="${RELEASE_VERSION}"
          tag="${RELEASE_TAG}"
          notes_args=(--generate-notes)
          if [ -f "changelog/${version}.md" ]; then
            notes_args=(--notes-file "changelog/${version}.md")
          elif [ -f "changelog/${version}/en.md" ]; then
            notes_args=(--notes-file "changelog/${version}/en.md")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            create_args=()
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              create_args+=(--verify-tag)
            else
              create_args+=(--target "$GITHUB_SHA")
              if [ "${INPUT_DRAFT}" = "true" ]; then
                create_args+=(--draft)
              fi
              if [ "${INPUT_PRERELEASE}" = "true" ]; then
                create_args+=(--prerelease)
              fi
            fi
            gh release create "$tag" release-assets/* "${create_args[@]}" \
              --title "Prism Downloader ${tag}" "${notes_args[@]}"
          fi
